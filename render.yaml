services:
  - type: web
    name: quick-report-api
    runtime: node
    plan: free
    buildCommand: npm install && cd clients && npm install && npm run build && cd ..
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: quick-report-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
